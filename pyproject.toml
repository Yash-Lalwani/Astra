[project]
name = "astra"
version = "0.1.0"
description = "Multi-agent auditing of clinical trial reporting integrity"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langgraph-checkpoint-postgres",
    "langmem",
    "langchain-mcp-adapters",
    "langsmith",
    "psycopg[binary]",
    "psycopg-pool",
    "google-cloud-storage",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "pydantic-settings",
    "requests",
    "httpx",
    "tenacity",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["MOSAIC_GCP", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
